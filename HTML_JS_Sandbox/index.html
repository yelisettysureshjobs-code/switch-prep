<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="index.js" defer></script>

</head>

<body>
    <div class="flex gap-x-4 p-4" id="tab-parent">
        <div data-tab="1" tabindex="0"
            class="w-fit px-3 h-fit border border-solid border-red-400 bg-red-300 rounded-lg flex items-center justify-center text-white">
            red
        </div>

        <div data-tab="2" tabindex="0"
            class="w-fit px-3 h-fit border border-solid border-blue-400 bg-blue-300 rounded-lg flex items-center justify-center text-white">
            blue
        </div>

        <div data-tab="3" tabindex="0"
            class="w-fit px-3 h-fit border border-solid border-green-400 bg-green-300 rounded-lg flex items-center justify-center text-white">
            green
        </div>
    </div>

    <div class="flex p-4" id="tabs">
        <div class="h-60 w-60 bg-red-400 rounded-lg" id="tab-1"></div>
        <div class="h-60 w-60 bg-blue-400 rounded-lg hidden" id="tab-2"></div>
        <div class="h-60 w-60 bg-green-400 rounded-lg hidden" id="tab-3"></div>
    </div>
</body>

</html>
